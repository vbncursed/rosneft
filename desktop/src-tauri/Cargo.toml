[package]
name = "andrey-desktop"
# Kept in step with `version` in tauri.conf.json, which is what the bundler and
# the installer names use. The CI release job refuses to publish when the tag,
# that field and this one disagree.
version = "0.2.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
# gzip/brotli/deflate are not optional: the gateway compresses every JSON
# response (chi Compressor, br/gzip/deflate), and without these features
# reqwest hands the compressed bytes straight to the webview, which then
# fails res.json() with a SyntaxError. With them, reqwest advertises only
# what it can decode and strips Content-Encoding/Content-Length once it has.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "gzip", "brotli", "deflate"] }
async-stream = "0.3"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
rand = "0.9"
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# A second process would bind the fallback loopback port (the fixed one is
# taken by the first), and its login would delete the keychain entry the first
# instance is running on. On macOS a second launch of the .app already just
# activates the running one; on Windows it really does start a second process.
tauri-plugin-single-instance = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
flate2 = "1"
