<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f11" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f4f1" />
    <title>No connection — Andrey Viewer</title>
    <!-- Standalone document the service worker serves offline: it carries its own
         styles inline and needs no JS, because the app bundle isn't reachable
         without the network. The colours are the design system's tokens
         (src/app/styles/theme.css), copied by hand — this page cannot import
         them. The type is the tokens' fallback stack: the Archivo and
         JetBrains Mono files are bundled assets the offline page cannot rely on. -->
    <style>
      :root {
        --bg: #0e0f11;
        --panel: #16181b;
        --line: #282c31;
        --fg: #f1f2f3;
        --muted: #9ba1a8;
        --accent: #f97316;
        --accent-fg: #0e0f11;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f4f1;
          --panel: #ffffff;
          --line: #e3e1db;
          --fg: #16181b;
          --muted: #55595f;
          --accent: #e5610a;
          --accent-fg: #ffffff;
        }
      }
      html { -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "Helvetica Neue", system-ui, sans-serif;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      }
      section {
        box-sizing: border-box;
        max-width: 30rem;
        padding: 2rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }
      p.overline {
        margin: 0 0 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; font-weight: 600; }
      p { margin: 0 0 1.5rem; font-size: 0.875rem; line-height: 1.5; color: var(--muted); }
      a {
        display: inline-block;
        padding: 0.625rem 1rem;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-fg);
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        touch-action: manipulation;
        transition: scale 150ms ease-out;
      }
      a:active { scale: 0.97; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="overline">Andrey Viewer</p>
        <h1>No connection</h1>
        <p>
          This app needs a connection — territories and models load from the server.
          Check your network and try again.
        </p>
        <!-- Plain <a>: a full document request lets the service worker retry the
             network. There is no router here — the JS bundle never loaded. -->
        <a href="/">Retry</a>
      </section>
    </main>
  </body>
</html>
