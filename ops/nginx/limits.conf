# ops/nginx/limits.conf → /etc/nginx/conf.d/limits.conf
#
# limit_req_zone only works at the http level, and on Debian/Ubuntu that's
# /etc/nginx/nginx.conf, not the vhost — conf.d is included from http and is
# empty here, so this file lands with nothing to conflict with.
#
# Zone names are prefixed rosneft_: this same nginx also serves an unrelated
# simpa-bot vhost, and limit_req_zone shares one namespace across every file
# conf.d includes, so an unprefixed "api" or "login" could collide with
# whatever that vhost defines for itself.
#
# The gateway cannot rate-limit by IP itself: it deliberately refuses to
# rewrite RemoteAddr from X-Forwarded-For (see GHSA-3fxj-6jh8-hvhx, cited in
# backend/services/gateway-service/internal/bootstrap/transport.go), so every
# request reaches Go already carrying nginx's own address, not the client's.
# In nginx, $binary_remote_addr is still the real client — this is the only
# place in the stack where a per-IP limiter buckets correctly.
limit_req_zone $binary_remote_addr zone=rosneft_api:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=rosneft_login:10m rate=5r/m;

# Tell a throttled client it's throttled. nginx's default for a rejected
# limit_req is 503 (Service Unavailable), which reads as "the backend is
# down" — 429 (Too Many Requests) is the honest status here.
limit_req_status 429;
