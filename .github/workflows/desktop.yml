name: Build desktop app

# Manual runs build artifacts; pushing a v* tag also publishes a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          - name: windows-arm64
            os: windows-11-arm
            args: --win --arm64
          - name: linux-x64
            os: ubuntu-latest
            args: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Installing on the target OS/arch pulls the matching native sharp binary.
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # build.mjs: next build -> fold static/public into standalone -> electron-builder.
      - name: Build & package
        working-directory: desktop
        run: node build.mjs ${{ matrix.args }}

      - uses: actions/upload-artifact@v6
        with:
          name: andrey-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Wipe the existing release (keeps the tag) so stale/renamed assets from a
      # previous run don't linger alongside the fresh ones. No-op on first publish.
      - name: Remove existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
