name: deploy

# Merge to main: gate (the same workflows a PR runs) -> images to GHCR -> SSH to
# the server, whose forced command (ops/deploy/deploy.sh) backs up, rolls out,
# checks and rolls back on failure. workflow_dispatch redeploys an existing
# commit's images (retry or rollback): no gate, no build.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "ops/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/backend.yml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (40 hex); default is the head of the selected ref"
        required: false
        type: string

permissions:
  contents: read

# Deploys run strictly one after another and a running one is never cancelled.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  backend:
    if: github.event_name == 'push'
    uses: ./.github/workflows/backend.yml

  frontend:
    if: github.event_name == 'push'
    uses: ./.github/workflows/frontend.yml

  ops:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make -C ops check

  images:
    needs: [backend, frontend, ops]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { svc: gateway, context: ./backend, file: backend/services/gateway-service/Dockerfile }
          - { svc: catalog, context: ./backend, file: backend/services/catalog-service/Dockerfile }
          - { svc: auth, context: ./backend, file: backend/services/auth-service/Dockerfile }
          - { svc: twofa, context: ./backend, file: backend/services/twofa-service/Dockerfile }
          - { svc: passkey, context: ./backend, file: backend/services/passkey-service/Dockerfile }
          - { svc: content, context: ./backend, file: backend/services/content-service/Dockerfile }
          - { svc: audit, context: ./backend, file: backend/services/audit-service/Dockerfile }
          - { svc: mesh-api, context: ./backend, file: backend/services/mesh-service/Dockerfile.api }
          - { svc: mesh-worker, context: ./backend, file: backend/services/mesh-service/Dockerfile.worker }
          - { svc: asset, context: ./backend, file: backend/services/asset-service/Dockerfile }
          - { svc: upload, context: ./backend, file: backend/services/upload-service/Dockerfile }
          - { svc: frontend, context: ./frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag is the full commit SHA, never `latest`: the server pins to it and
      # rollback names the previous one.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/vbncursed/andrey-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,scope=${{ matrix.svc }},mode=max

  deploy:
    needs: images
    # On a push the gate and the images must have succeeded. On a manual run
    # those jobs are skipped (not failed), and `needs` alone would skip this
    # one too, hence the explicit condition.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.images.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    # packages: read — the images are private; this token is handed to the
    # server over ssh stdin for `docker login` and dies with the job.
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ inputs.sha || github.sha }}
      ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: validate sha
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex"; exit 1; }

      # A manual run builds nothing, so fail here, before ssh, if any image of
      # that commit is missing (it only exists if the commit passed the gate).
      - name: verify images exist
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf '%s\n' "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          missing=0
          for svc in gateway catalog auth twofa passkey content audit mesh-api mesh-worker asset upload frontend; do
            docker manifest inspect "ghcr.io/vbncursed/andrey-$svc:$SHA" >/dev/null || { echo "::error::missing image andrey-$svc:$SHA"; missing=1; }
          done
          exit "$missing"

      - name: roll out
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The token goes on stdin only: not in argv, not in the log. The
          # server's forced command reads it and the "<sha> <actor>" words.
          printf '%s\n' "$GITHUB_TOKEN" | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" "$SHA $ACTOR"
