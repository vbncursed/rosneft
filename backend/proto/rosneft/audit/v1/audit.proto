syntax = "proto3";

package rosneft.audit.v1;

option go_package = "github.com/vbncursed/rosneft/backend/proto/gen/go/rosneft/audit/v1;auditv1";

import "google/protobuf/timestamp.proto";

// AuditService owns the append-only change journal. Rows reach it two ways:
// Postgres triggers capture every data mutation, and Record() takes the events
// that are not row changes at all — login, logout, password change — because
// sessions live in Redis, where no trigger can see them.
service AuditService {
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc Record(RecordRequest) returns (RecordResponse);
}

message Entry {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  string actor_id = 3;     // empty = system change (mesh-worker, migrations)
  string company_id = 4;   // empty = Root or system change
  string action = 5;       // 'territory.update', 'auth.login'
  string entity = 6;
  string entity_id = 7;
  string entity_label = 8; // slug/email at the time; outlives the row
  string old_row = 9;      // raw JSON, forwarded verbatim; the client diffs it
  string new_row = 10;
  string request_id = 11;
  string result = 12;
}

message ListEntriesRequest {
  // all_companies is an explicit flag rather than "empty company_id means all",
  // so an accidentally blank tenant id can never widen a Company Owner's view
  // to the whole platform. The gateway sets exactly one of the two.
  bool all_companies = 1;
  string company_id = 2;

  string actor_id = 3;
  string action = 4;
  string entity = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
  int64 cursor = 8; // exclusive upper bound on id; 0 = newest page
  int32 limit = 9;
}
message ListEntriesResponse {
  repeated Entry entries = 1;
  int64 next_cursor = 2; // 0 = no further pages
}

message RecordRequest {
  string actor_id = 1;
  string company_id = 2;
  string action = 3;
  string entity = 4;
  string entity_id = 5;
  string entity_label = 6;
  string request_id = 7;
  string result = 8;
}
message RecordResponse {
  int64 id = 1;
}
