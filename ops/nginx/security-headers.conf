# ops/nginx/security-headers.conf → /etc/nginx/snippets/security-headers.conf
#
# One header policy, included from three places in rosneft.conf. It is a
# snippet rather than a server-level block because nginx's add_header does
# not merge: a location that declares any add_header of its own drops every
# inherited one. Two locations here do exactly that (they set Cache-Control),
# so a server-level-only policy would silently skip both — including the only
# block that ever returns HTML. Four hand-rolled copies would diverge; one
# file cannot.
#
# snippets/ and not conf.d/: on Debian nginx.conf auto-includes conf.d/*.conf
# into the http block, which would apply these at http level and double them
# wherever the file is also included explicitly. snippets/ is never
# auto-included.
#
# SAMEORIGIN, never DENY. document-view.tsx loads /pdfjs/web/viewer.html in a
# same-origin <iframe>, and DENY blocks same-origin framing too — it would
# turn every PDF overlay into an empty box with no console error worth the
# name. The PiP window (use-pip-window.ts) reparents that same iframe and is
# same-origin as well.
#
# X-Robots-Tag over a robots.txt rule: robots.txt on this host is
# Cloudflare-managed and answers "Allow: /" for Googlebot, so it cannot be
# edited from this repo. The header is also the stronger signal — it removes
# an already-indexed URL, which Disallow cannot do. Nothing here is public:
# every route is behind a session, and the login screen of an internal tool
# has no business in a search index.
#
# always: without it nginx attaches add_header only to 2xx/3xx, and the 401
# that /api/auth/me answers on a cold load is exactly a response that should
# still carry nosniff and HSTS.
#
# No Content-Security-Policy here on purpose. three.js, the Draco/basis
# decoders and pdf.js each need their own script/wasm/worker allowances, and
# a policy written from the textbook renders territories as an empty dark
# scene with nothing in the console — the desktop shell already learned this
# the expensive way. CSP is its own task, verified against a real territory.
add_header X-Robots-Tag              "noindex, nofollow" always;
add_header X-Frame-Options           "SAMEORIGIN"        always;
add_header X-Content-Type-Options    "nosniff"           always;
add_header Referrer-Policy           "no-referrer"       always;
add_header Strict-Transport-Security "max-age=31536000"  always;
