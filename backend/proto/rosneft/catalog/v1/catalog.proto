syntax = "proto3";

package rosneft.catalog.v1;

option go_package = "github.com/vbncursed/rosneft/backend/proto/gen/go/rosneft/catalog/v1;catalogv1";

import "google/protobuf/timestamp.proto";

// CatalogService owns the registry of two domain entities:
//
//   - Territory — a parent scene (terrain, photogrammetry mesh) the
//     viewer walks around in.
//   - Model     — a placeable asset (equipment, fixture) overlaid on a
//     territory at a specific transform.
//
// Each entity has its own artifact family (territory_artifacts /
// model_artifacts) holding the converted GLB outputs per LOD. Source
// files are stored as content-addressed ZIP archives in BlobStore;
// the catalog only keeps the hash.
service CatalogService {
  rpc ListTerritories(ListTerritoriesRequest) returns (ListTerritoriesResponse);
  // ResolveTerritorySlugs labels territory ids for the audit journal, which
  // knows a placement's parent only as the number in its row snapshot. The
  // public Territory message carries a slug and no id on purpose; adding one
  // would change a shape the whole scene reads for an internal lookup.
  rpc ResolveTerritorySlugs(ResolveTerritorySlugsRequest) returns (ResolveTerritorySlugsResponse);
  // ResolveLabels names catalog rows for the audit journal, whose snapshots
  // carry a parent or a target only as a number. It is the plural, multi-kind
  // sibling of ResolveTerritorySlugs, which stays because the entry-level
  // enrichment already calls it.
  rpc ResolveLabels(ResolveLabelsRequest) returns (ResolveLabelsResponse);
  // ResolveBlobAccess answers whether a caller scoped to scope_admin_id may read
  // the bytes behind a content-addressed hash. A blob is reachable when it
  // belongs to a model (models are a shared library) or to a territory assigned
  // to that caller. An empty scope_admin_id means Root and disables the filter.
  rpc ResolveBlobAccess(ResolveBlobAccessRequest) returns (ResolveBlobAccessResponse);
  rpc GetTerritory(GetTerritoryRequest) returns (GetTerritoryResponse);
  rpc UpsertTerritory(UpsertTerritoryRequest) returns (UpsertTerritoryResponse);
  rpc UpdateTerritory(UpdateTerritoryRequest) returns (UpdateTerritoryResponse);
  rpc DeleteTerritory(DeleteTerritoryRequest) returns (DeleteTerritoryResponse);
  rpc RegisterTerritoryArtifact(RegisterTerritoryArtifactRequest) returns (RegisterTerritoryArtifactResponse);
  rpc ListTerritoryArtifacts(ListTerritoryArtifactsRequest) returns (ListTerritoryArtifactsResponse);
  rpc GetTerritoryArtifact(GetTerritoryArtifactRequest) returns (GetTerritoryArtifactResponse);
  rpc DeleteTerritoryArtifacts(DeleteTerritoryArtifactsRequest) returns (DeleteTerritoryArtifactsResponse);
  rpc SetTerritoryRescaleBaseline(SetTerritoryRescaleBaselineRequest) returns (SetTerritoryRescaleBaselineResponse);
  rpc RescaleTerritoryPlacements(RescaleTerritoryPlacementsRequest) returns (RescaleTerritoryPlacementsResponse);
  rpc SetTerritoryAdmins(SetTerritoryAdminsRequest) returns (SetTerritoryAdminsResponse);
  rpc GetTerritoryAdmins(GetTerritoryAdminsRequest) returns (GetTerritoryAdminsResponse);
  // ListTerritoryAdmins is GetTerritoryAdmins for many territories in one
  // query: the access screen used to ask once per territory.
  rpc ListTerritoryAdmins(ListTerritoryAdminsRequest) returns (ListTerritoryAdminsResponse);

  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
  rpc UpsertModel(UpsertModelRequest) returns (UpsertModelResponse);
  rpc UpdateModel(UpdateModelRequest) returns (UpdateModelResponse);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
  rpc RegisterModelArtifact(RegisterModelArtifactRequest) returns (RegisterModelArtifactResponse);
  rpc ListModelArtifacts(ListModelArtifactsRequest) returns (ListModelArtifactsResponse);
  rpc GetModelArtifact(GetModelArtifactRequest) returns (GetModelArtifactResponse);

  rpc ListPlacements(ListPlacementsRequest) returns (ListPlacementsResponse);
  rpc CreatePlacement(CreatePlacementRequest) returns (CreatePlacementResponse);
  // CreatePlacements lands 1–100 placements on one territory in one
  // transaction: all of them, or none.
  rpc CreatePlacements(CreatePlacementsRequest) returns (CreatePlacementsResponse);
  rpc UpdatePlacement(UpdatePlacementRequest) returns (UpdatePlacementResponse);
  rpc SetPlacementVisibility(SetPlacementVisibilityRequest) returns (SetPlacementVisibilityResponse);
  rpc DeletePlacement(DeletePlacementRequest) returns (DeletePlacementResponse);

  // Measurements are scoped by territory_slug on every call: an id that
  // belongs to another territory is NOT_FOUND, same as an unknown one.
  rpc ListMeasurements(ListMeasurementsRequest) returns (ListMeasurementsResponse);
  rpc CreateMeasurement(CreateMeasurementRequest) returns (CreateMeasurementResponse);
  rpc UpdateMeasurement(UpdateMeasurementRequest) returns (UpdateMeasurementResponse);
  rpc DeleteMeasurement(DeleteMeasurementRequest) returns (DeleteMeasurementResponse);
  rpc DeleteMeasurements(DeleteMeasurementsRequest) returns (DeleteMeasurementsResponse);

  // Bulk placement writes: one UPDATE over ids on territory_slug in one
  // transaction. Every id must be on the territory or nothing changes and the
  // answer is NOT_FOUND; a repeated id counts once; 1–1000 ids.
  rpc SetPlacementsHidden(SetPlacementsHiddenRequest) returns (SetPlacementsHiddenResponse);
  rpc SetPlacementsGroup(SetPlacementsGroupRequest) returns (SetPlacementsGroupResponse);

  // Placement groups are scoped by territory_slug like measurements: an id of
  // another territory is NOT_FOUND, same as an unknown one.
  rpc ListPlacementGroups(ListPlacementGroupsRequest) returns (ListPlacementGroupsResponse);
  rpc CreatePlacementGroup(CreatePlacementGroupRequest) returns (CreatePlacementGroupResponse);
  rpc RenamePlacementGroup(RenamePlacementGroupRequest) returns (RenamePlacementGroupResponse);
  rpc DeletePlacementGroup(DeletePlacementGroupRequest) returns (DeletePlacementGroupResponse);
}

// Vec3 represents a point in 3D space (used for bounding-box corners
// and placement transforms).
message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Territory is a scene the viewer renders as the parent canvas.
// source_blob_hash points at the ZIP archive in BlobStore that
// contains the original OBJ, MTL, and texture files.
message Territory {
  string slug = 1;
  string title = 2;
  string description = 3;
  string source_blob_hash = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Optional link to an externally-hosted panorama tour. Empty = unset.
  string external_panorama_url = 7;
  // How many placements sit on this territory.
  uint32 placement_count = 8;
  // Every LOD artifact, sorted by lod. Filled by ListTerritories only: the list
  // pages need the chain and would otherwise ask once per row.
  repeated TerritoryArtifact artifacts = 9;
}

// Model is a placeable 3D asset overlaid on a territory.
message Model {
  string slug = 1;
  string title = 2;
  string description = 3;
  string source_blob_hash = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Optional thumbnail image blob hash ('' = none), served via /api/assets.
  string thumbnail_blob_hash = 7;
  // How many distinct territories place this model.
  uint32 usage_count = 8;
  // Every LOD artifact, sorted by lod. Filled by ListModels only.
  repeated ModelArtifact artifacts = 9;
}

// TerritoryArtifact is a converted GLB output for one territory + LOD.
message TerritoryArtifact {
  string territory_slug = 1;
  uint32 lod = 2;
  string hash = 3;
  string content_type = 4;
  int64 size = 5;
  uint64 vertices = 6;
  uint64 faces = 7;
  Vec3 bbox_min = 8;
  Vec3 bbox_max = 9;
  google.protobuf.Timestamp created_at = 10;
}

// ModelArtifact is a converted GLB output for one model + LOD.
message ModelArtifact {
  string model_slug = 1;
  uint32 lod = 2;
  string hash = 3;
  string content_type = 4;
  int64 size = 5;
  uint64 vertices = 6;
  uint64 faces = 7;
  Vec3 bbox_min = 8;
  Vec3 bbox_max = 9;
  google.protobuf.Timestamp created_at = 10;
}

// Placement is one instance of a model overlaid on a territory at a
// specific transform. Position is in scene units; rotation is Euler XYZ
// in radians (Three.js convention); scale is per-axis to allow
// non-uniform stretching.
message Placement {
  int64 id = 1;
  string territory_slug = 2;
  string model_slug = 3;
  Vec3 position = 4;
  Vec3 rotation = 5;
  Vec3 scale = 6;
  string label = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // visible_panorama_ids is the allowlist of panoramas this placement is
  // shown in (panorama mode only — the 3D view always shows every
  // placement). Empty means the placement is hidden in every panorama.
  repeated int64 visible_panorama_ids = 10;
  // hidden is shared: a hidden placement is not drawn for anyone who opens
  // the territory. Only SetPlacementsHidden changes it.
  bool hidden = 11;
  // group_id is the placement's user group; absent when it is in none.
  optional int64 group_id = 12;
}

// Measurement is a saved ruler chain on a territory. points is flat —
// x0,y0,z0,x1,… in the territory's normalised scene space, the space placement
// positions use — so its length is a multiple of three: at least two points,
// at least three when closed.
message Measurement {
  int64 id = 1;
  string territory_slug = 2;
  repeated double points = 3;
  bool closed = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// PlacementGroup is a user-made group of placements on a territory. A
// placement is in at most one; deleting the group returns its placements to
// no group.
message PlacementGroup {
  int64 id = 1;
  string territory_slug = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// ─── Territory RPCs ─────────────────────────────────────────────────────────

message ListTerritoriesRequest {
  // When non-empty, restrict the result to territories assigned to this admin.
  // Empty means no filter (Root and internal callers see everything).
  string scope_admin_id = 1;
  // Attach each territory's LOD chain. Off by default: only the list screens
  // render it, and every other caller would pay one query for nothing.
  bool with_artifacts = 2;
}
message ListTerritoriesResponse {
  repeated Territory territories = 1;
}
message ResolveTerritorySlugsRequest {
  repeated int64 ids = 1; // at most 500; non-positive ids are dropped
}
message ResolveTerritorySlugsResponse {
  // Ids that match nothing are absent: the journal outlives the territories it
  // describes, and the caller falls back to leaving the column empty.
  map<int64, string> slugs = 1;
}

// LabelRef is one id to name. kind is "territory", "model" or "panorama".
message LabelRef {
  string kind = 1;
  int64 id = 2;
}
message ResolveBlobAccessRequest {
  string hash = 1;
  // Empty means Root: no filter. The gateway must never send an empty scope for
  // a non-Root caller — that would open every blob in the system.
  string scope_admin_id = 2;
}
message ResolveBlobAccessResponse {
  bool allowed = 1;
}

message ResolveLabelsRequest {
  // At most 500. A kind this service does not know is dropped rather than
  // refused: during a rolling deploy a newer gateway may ask for one, and a
  // single unknown kind must not cost the reader every other label on the page.
  repeated LabelRef refs = 1;
}
message ResolveLabelsResponse {
  // Keyed "<kind>:<id>". Refs that match nothing are absent — the journal
  // outlives the rows it describes.
  map<string, string> labels = 1;
}

message GetTerritoryRequest {
  string slug = 1;
  string scope_admin_id = 2; // see ListTerritoriesRequest; empty = no scope check
}
message GetTerritoryResponse {
  Territory territory = 1;
}

message SetTerritoryAdminsRequest {
  string slug = 1;
  repeated string admin_user_ids = 2; // full replacement set
}
message SetTerritoryAdminsResponse {}

message GetTerritoryAdminsRequest {
  string slug = 1;
}
message GetTerritoryAdminsResponse {
  repeated string admin_user_ids = 1;
}

message ListTerritoryAdminsRequest {
  repeated string slugs = 1;
}
// TerritoryAdmin is one assignment. Flat pairs rather than a map of lists: a
// proto map cannot hold a repeated value without a wrapper message.
message TerritoryAdmin {
  string territory_slug = 1;
  string admin_user_id = 2;
}
message ListTerritoryAdminsResponse {
  // Grouped by territory, in assignment order within one. A slug nobody is
  // assigned to, or that does not exist, contributes no pair.
  repeated TerritoryAdmin admins = 1;
}

message UpsertTerritoryRequest {
  Territory territory = 1;
}
message UpsertTerritoryResponse {
  Territory territory = 1;
}

// UpdateTerritory writes only the fields it carries, in one UPDATE: an absent
// field keeps the stored value, a present empty one clears it. A partial edit
// must not write back columns it read earlier, or it reverts a concurrent
// source replace (or a concurrent title edit). Unknown slug is NOT_FOUND.
message UpdateTerritoryRequest {
  string slug = 1;
  optional string title = 2;
  optional string description = 3;
  optional string external_panorama_url = 4;
  optional string source_blob_hash = 5;
}
message UpdateTerritoryResponse {
  Territory territory = 1;
}

message DeleteTerritoryRequest {
  string slug = 1;
}
message DeleteTerritoryResponse {}

message RegisterTerritoryArtifactRequest {
  TerritoryArtifact artifact = 1;
}
message RegisterTerritoryArtifactResponse {
  TerritoryArtifact artifact = 1;
}

message ListTerritoryArtifactsRequest {
  string territory_slug = 1;
}
message ListTerritoryArtifactsResponse {
  repeated TerritoryArtifact artifacts = 1;
}

message GetTerritoryArtifactRequest {
  string territory_slug = 1;
  uint32 lod = 2;
}
message GetTerritoryArtifactResponse {
  TerritoryArtifact artifact = 1;
}

// DeleteTerritoryArtifacts clears every LOD artifact of a territory, used to
// reset it to a pending state before a source-replacement re-conversion.
message DeleteTerritoryArtifactsRequest {
  string territory_slug = 1;
}
message DeleteTerritoryArtifactsResponse {}

// SetTerritoryRescaleBaseline records the territory's current source-mesh
// max-dimension and bbox center before a source replacement clears its
// artifacts. The post-conversion RescaleTerritoryPlacements reads both to keep
// placements 1:1 across the new normalization. Writes only when no baseline is
// already pending, preserving the earliest values across chained replaces.
message SetTerritoryRescaleBaselineRequest {
  string territory_slug = 1;
  double source_max = 2;
  // Center of the same source bbox. Required; a request without it is refused
  // (InvalidArgument).
  Vec3 source_center = 3;
}
message SetTerritoryRescaleBaselineResponse {}

// RescaleTerritoryPlacements applies a pending rescale baseline: every
// placement position, measurement point and panorama anchor becomes
// s·(old_max/new_source_max) + (old_center − new_source_center)·2/new_source_max,
// placement scale is multiplied by old_max/new_source_max, and the baseline
// is cleared — atomically. A baseline with no center shifts nothing. A no-op
// when no baseline is set. The response reports how many placements were
// changed (measurements and panoramas are not counted).
message RescaleTerritoryPlacementsRequest {
  string territory_slug = 1;
  double new_source_max = 2;
  // Center of the new LOD0 source bbox. Required; a request without it is
  // refused (InvalidArgument).
  Vec3 new_source_center = 3;
}
message RescaleTerritoryPlacementsResponse {
  uint32 updated = 1;
}

// ─── Model RPCs ─────────────────────────────────────────────────────────────

message ListModelsRequest {
  // Attach each model's LOD chain; off by default, as on ListTerritoriesRequest.
  bool with_artifacts = 1;
}
message ListModelsResponse {
  repeated Model models = 1;
}

message GetModelRequest {
  string slug = 1;
}
message GetModelResponse {
  Model model = 1;
}

message UpsertModelRequest {
  Model model = 1;
}
message UpsertModelResponse {
  Model model = 1;
}

// UpdateModel writes only the fields it carries — see UpdateTerritoryRequest.
message UpdateModelRequest {
  string slug = 1;
  optional string title = 2;
  optional string description = 3;
  optional string thumbnail_blob_hash = 4;
}
message UpdateModelResponse {
  Model model = 1;
}

message DeleteModelRequest {
  string slug = 1;
}
message DeleteModelResponse {}

message RegisterModelArtifactRequest {
  ModelArtifact artifact = 1;
}
message RegisterModelArtifactResponse {
  ModelArtifact artifact = 1;
}

message ListModelArtifactsRequest {
  string model_slug = 1;
}
message ListModelArtifactsResponse {
  repeated ModelArtifact artifacts = 1;
}

message GetModelArtifactRequest {
  string model_slug = 1;
  uint32 lod = 2;
}
message GetModelArtifactResponse {
  ModelArtifact artifact = 1;
}

// ─── Placement RPCs ─────────────────────────────────────────────────────────

message ListPlacementsRequest {
  string territory_slug = 1;
}
message ListPlacementsResponse {
  repeated Placement placements = 1;
}

message CreatePlacementRequest {
  string territory_slug = 1;
  string model_slug = 2;
  Vec3 position = 3;
  Vec3 rotation = 4;
  Vec3 scale = 5;
  string label = 6;
  // Initial panorama allowlist — a placement created while a panorama is
  // active carries that panorama so it shows where it was dropped.
  repeated int64 visible_panorama_ids = 7;
  // Group the new placement lands in. A group of another territory is
  // NOT_FOUND, like an unknown one.
  optional int64 group_id = 8;
}
message CreatePlacementResponse {
  Placement placement = 1;
}
message CreatePlacementsRequest {
  string territory_slug = 1;
  // 1–100. Each item's own territory_slug is ignored: the batch lands on the
  // territory above, the one the gateway's territory gate checked.
  repeated CreatePlacementRequest items = 2;
  // Optional. A batch already stored under this key on the territory is
  // answered as stored and nothing is written; one of another size is
  // AlreadyExists. Empty means no idempotency, as before.
  string idempotency_key = 3;
}
message CreatePlacementsResponse {
  repeated Placement placements = 1; // in items order
}

message UpdatePlacementRequest {
  int64 id = 1;
  Vec3 position = 2;
  Vec3 rotation = 3;
  Vec3 scale = 4;
  string label = 5;
  // Scopes the lookup: an id from another territory reads as not found.
  string territory_slug = 6;
}
message UpdatePlacementResponse {
  Placement placement = 1;
}

// SetPlacementVisibility replaces a placement's panorama allowlist in full
// (the panorama_ids must all belong to the placement's territory). Returns
// the updated placement so callers can re-key on the new updated_at.
message SetPlacementVisibilityRequest {
  string territory_slug = 1;
  int64 placement_id = 2;
  repeated int64 panorama_ids = 3;
}
message SetPlacementVisibilityResponse {
  Placement placement = 1;
}

message DeletePlacementRequest {
  int64 id = 1;
  // Scopes the lookup: an id from another territory reads as not found.
  string territory_slug = 2;
}
message DeletePlacementResponse {}

// ─── Measurement RPCs ───────────────────────────────────────────────────────

message ListMeasurementsRequest {
  string territory_slug = 1;
}
message ListMeasurementsResponse {
  repeated Measurement measurements = 1;
}

// CreateMeasurementRequest carries no author: catalog records the caller from
// the x-actor-id metadata.
message CreateMeasurementRequest {
  string territory_slug = 1;
  repeated double points = 2;
  bool closed = 3;
}
message CreateMeasurementResponse {
  Measurement measurement = 1;
}

// UpdateMeasurementRequest replaces the chain's points and closed flag.
message UpdateMeasurementRequest {
  string territory_slug = 1;
  int64 id = 2;
  repeated double points = 3;
  bool closed = 4;
}
message UpdateMeasurementResponse {
  Measurement measurement = 1;
}

message DeleteMeasurementRequest {
  string territory_slug = 1;
  int64 id = 2;
}
message DeleteMeasurementResponse {}

// DeleteMeasurementsRequest removes every measurement on the territory.
message DeleteMeasurementsRequest {
  string territory_slug = 1;
}
message DeleteMeasurementsResponse {
  uint32 deleted = 1;
}

// ─── Placement group RPCs ───────────────────────────────────────────────────

message SetPlacementsHiddenRequest {
  string territory_slug = 1;
  repeated int64 ids = 2;
  bool hidden = 3;
}
message SetPlacementsHiddenResponse {
  uint32 updated = 1;
}

// SetPlacementsGroupRequest moves ids into group_id, or out of any group when
// it is absent.
message SetPlacementsGroupRequest {
  string territory_slug = 1;
  repeated int64 ids = 2;
  optional int64 group_id = 3;
}
message SetPlacementsGroupResponse {
  uint32 updated = 1;
}

message ListPlacementGroupsRequest {
  string territory_slug = 1;
}
message ListPlacementGroupsResponse {
  repeated PlacementGroup groups = 1;
}

// The title is trimmed; 1–120 characters must remain.
message CreatePlacementGroupRequest {
  string territory_slug = 1;
  string title = 2;
}
message CreatePlacementGroupResponse {
  PlacementGroup group = 1;
}

message RenamePlacementGroupRequest {
  string territory_slug = 1;
  int64 id = 2;
  string title = 3;
}
message RenamePlacementGroupResponse {
  PlacementGroup group = 1;
}

message DeletePlacementGroupRequest {
  string territory_slug = 1;
  int64 id = 2;
}
message DeletePlacementGroupResponse {}
