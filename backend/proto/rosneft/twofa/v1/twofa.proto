syntax = "proto3";

package rosneft.twofa.v1;

option go_package = "github.com/vbncursed/rosneft/backend/proto/gen/go/rosneft/twofa/v1;twofav1";

// TwoFAService owns all TOTP/recovery state and logic. It is a leaf: it calls
// no other service. The gateway, which has already authenticated the caller,
// passes the resolved user id to the management RPCs; auth-service calls the
// internal RPCs during login with a trusted user id. Every caller is trusted to
// name the right user, so only those two may reach this service.
service TwoFAService {
  // Management surface.
  rpc Setup(SetupRequest) returns (SetupResponse);
  rpc Enable(EnableRequest) returns (EnableResponse);
  rpc Disable(DisableRequest) returns (DisableResponse);
  rpc RegenerateRecoveryCodes(RegenerateRequest) returns (RegenerateResponse);
  // Status is the caller's own 2FA posture, for the account screen. Separate
  // from IsEnabled, which auth-service calls on the hot path and must not pay
  // for the recovery-code counts.
  rpc Status(StatusRequest) returns (StatusResponse);

  // Internal surface (called by auth-service during login).
  rpc IsEnabled(IsEnabledRequest) returns (IsEnabledResponse);
  // EnabledFor is the batch form of IsEnabled: the admin user list needs an
  // answer per user and must not cost a round trip per user. Ids absent from
  // the response are off — unenrolled and enrolled-but-disabled are the same
  // answer to the caller, so no per-id tri-state is needed here.
  rpc EnabledFor(EnabledForRequest) returns (EnabledForResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}

message SetupRequest {
  reserved 1;
  reserved "token";
  string user_id = 2;
  // Account name shown in the authenticator app (the user's login).
  string label = 3;
}
message SetupResponse {
  string secret = 1;
  string otpauth_url = 2;
}
message EnableRequest {
  reserved 1;
  reserved "token";
  string code = 2;
  string user_id = 3;
}
message EnableResponse { repeated string recovery_codes = 1; }
message DisableRequest {
  reserved 1;
  reserved "token";
  string code = 2;
  string user_id = 3;
}
message DisableResponse {}
message RegenerateRequest {
  reserved 1;
  reserved "token";
  string code = 2;
  string user_id = 3;
}
message RegenerateResponse { repeated string recovery_codes = 1; }
message StatusRequest {
  reserved 1;
  reserved "token";
  string user_id = 2;
}
message StatusResponse {
  bool enabled = 1;
  // Unix seconds. 0 means unknown — 2FA is off, or the enrolment predates the
  // enabled_at column. Never a guess.
  int64 enabled_at = 2;
  int64 recovery_remaining = 3;
  int64 recovery_total = 4;
}

message IsEnabledRequest { string user_id = 1; }
message IsEnabledResponse { bool enabled = 1; }
message EnabledForRequest { repeated string user_ids = 1; }
message EnabledForResponse { repeated string enabled_user_ids = 1; }
message VerifyRequest {
  string user_id = 1;
  string code = 2;
}
message VerifyResponse { bool valid = 1; }
