route:
  # Group by alert and by service: eight services flapping at once should be
  # eight lines in one message, not eight messages.
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  # Hourly. A firing alert that repeats every five minutes trains the reader
  # to mute the chat, which is the same as having no receiver at all.
  repeat_interval: 1h
  receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      # Both read from files, not inlined — the config below is tracked by
      # git, the secrets are not. chat_id is a file for the same reason the
      # token is: Alertmanager validates telegram_configs at config load
      # (notify/telegram/config.go, UnmarshalYAML) and a literal chat_id: 0
      # fails that check, which is fatal — config.LoadFile's error bubbles
      # straight out of alertmanager's main() and the container never
      # starts. chat_id_file/bot_token_file are only read at send time
      # (notify/telegram/telegram.go, getBotToken/getChatID), so a missing
      # file degrades one delivery instead of the whole process: a clone
      # with neither secret present still starts, still evaluates rules,
      # still shows firing alerts on :9093/api/v2/alerts — it just can't
      # reach Telegram, which is the one thing it was never going to be able
      # to do without a token anyway.
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        api_url: https://api.telegram.org
        parse_mode: HTML
        message: |
          <b>{{ .Status | toUpper }}</b> {{ .CommonLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}
