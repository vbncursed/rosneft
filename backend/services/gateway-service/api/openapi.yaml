openapi: 3.0.3
info:
  title: Andrey Backend Gateway API
  version: 0.3.0
  description: |
    Public REST surface for the Andrey 3D viewer frontend. This gateway is
    the only externally exposed component; it reaches catalog, content,
    auth, twofa, passkey, mesh-api, and upload over internal gRPC, and
    reverse-proxies asset-service for binary blobs.

    The catalog is split into two domains:
      • Territories — parent scenes the viewer renders as a canvas.
      • Models      — placeable 3D assets overlaid on a territory.

    Source files (OBJ + MTL + textures) are uploaded as a ZIP archive
    through the chunked /api/uploads endpoints; the resulting blob hash is
    then attached to a Territory or Model. The mesh-worker fetches the
    archive from BlobStore, runs the converter, and registers the GLB
    artifacts back in the catalog.

    Two endpoints are not typed JSON and are described with their real
    media types rather than a schema:
      • `GET /api/assets/{hash}` — transparent reverse proxy to
        asset-service returning raw `model/gltf-binary`, Range-aware, with
        a strong ETag and immutable caching.
      • `GET /api/jobs/{id}/events` — a `text/event-stream` of Job frames.

    Authentication is an opaque bearer token from `POST /api/auth/login`.
    Every mutating `/api/*` route is additionally gated on a per-route
    permission; `403` means the session is valid but lacks it.
servers:
  - url: http://localhost:8080
    description: Local docker-compose

components:
  schemas:
    Vec3:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, format: double }
        y: { type: number, format: double }
        z: { type: number, format: double }

    Territory:
      type: object
      required: [slug, title, sourceBlobHash]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        externalPanoramaUrl: { type: string }
        sourceBlobHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Model:
      type: object
      required: [slug, title, sourceBlobHash]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        sourceBlobHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        thumbnailBlobHash:
          type: string
          pattern: '^([0-9a-f]{64})?$'
          description: |
            Optional thumbnail image blob hash. Empty/absent = no thumbnail.
            Fetch the image from /api/assets/{thumbnailBlobHash}.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LodArtifact:
      type: object
      required: [lod, hash, size]
      description: |
        Minimal descriptor for one LOD level. Carries only size/geometry
        stats — bbox, contentType, createdAt are LOD-invariant and live
        on the parent Artifact.
      properties:
        lod: { type: integer, format: int32, minimum: 0 }
        hash: { type: string }
        size: { type: integer, format: int64 }
        vertices: { type: integer, format: int64 }
        faces: { type: integer, format: int64 }

    Artifact:
      type: object
      required: [slug, lod, hash, contentType, size]
      properties:
        slug:
          type: string
          description: Owner slug (territory or model, depending on the endpoint).
        lod: { type: integer, format: int32, minimum: 0 }
        hash: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        vertices: { type: integer, format: int64 }
        faces: { type: integer, format: int64 }
        bboxMin: { $ref: '#/components/schemas/Vec3' }
        bboxMax: { $ref: '#/components/schemas/Vec3' }
        createdAt: { type: string, format: date-time }
        artifacts:
          type: array
          description: |
            All available LODs for this owner, sorted by lod ascending.
            Populated by /scene; absent on /artifacts list/get endpoints
            where the array would be redundant.
          items: { $ref: '#/components/schemas/LodArtifact' }

    JobStatus:
      type: string
      enum: [pending, running, succeeded, failed]

    JobKind:
      type: string
      description: Which catalog domain the job's outputs belong to.
      enum: [territory, model]

    Job:
      type: object
      required: [id, kind, slug, status]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/JobKind' }
        slug: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        errorMessage: { type: string }
        artifactHash: { type: string }
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Fraction of conversion work completed (0..1).
        stage:
          type: string
          description: |
            Coarse-grained phase label set by the worker — one of
            "fetching" / "extracting" / "parsing" / "encoding" /
            "compressing" / "lod-N" / "registering".
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Placement:
      type: object
      required: [id, territorySlug, modelSlug, position, rotation, scale]
      properties:
        id: { type: integer, format: int64 }
        territorySlug: { type: string }
        modelSlug: { type: string }
        position: { $ref: '#/components/schemas/Vec3' }
        rotation: { $ref: '#/components/schemas/Vec3' }
        scale: { $ref: '#/components/schemas/Vec3' }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        visiblePanoramaIds:
          type: array
          description: >
            Allowlist of panorama ids this placement is shown in (panorama
            mode only — the 3D view always shows every placement). Empty means
            hidden in every panorama.
          items: { type: integer, format: int64 }

    PlacementCreate:
      type: object
      required: [modelSlug]
      properties:
        modelSlug: { type: string }
        position: { $ref: '#/components/schemas/Vec3' }
        rotation: { $ref: '#/components/schemas/Vec3' }
        scale: { $ref: '#/components/schemas/Vec3' }
        label: { type: string }
        visiblePanoramaIds:
          type: array
          description: Initial panorama allowlist (e.g. the active panorama).
          items: { type: integer, format: int64 }

    PlacementUpdate:
      type: object
      properties:
        position: { $ref: '#/components/schemas/Vec3' }
        rotation: { $ref: '#/components/schemas/Vec3' }
        scale: { $ref: '#/components/schemas/Vec3' }
        label: { type: string }

    PlacementVisibilityUpdate:
      type: object
      required: [panoramaIds]
      properties:
        panoramaIds:
          type: array
          description: Full replacement allowlist of panorama ids.
          items: { type: integer, format: int64 }

    Panorama:
      type: object
      required: [id, territorySlug, slug, title, sourceBlobHash, position, yawOffset, defaultYaw]
      description: |
        Equirectangular panorama (Insta360 Pro source) anchored to a point
        in a territory's scene-units space. The viewer "panorama mode"
        teleports the camera to position and renders a sphere skybox;
        placements stay shared with the 3D view so equipment placed in
        either mode is visible from the other.
      properties:
        id: { type: integer, format: int64 }
        territorySlug: { type: string }
        slug: { type: string }
        title: { type: string }
        sourceBlobHash:
          type: string
          description: BlobStore hash for the equirect JPG/PNG; served via /api/assets/{hash}.
        position: { $ref: '#/components/schemas/Vec3' }
        yawOffset:
          type: number
          format: double
          description: |
            Rotation around the sphere's Y axis (radians) to align the
            panorama's implicit "north" with the territory's axes.
        defaultYaw:
          type: number
          format: double
          description: |
            Default horizontal camera yaw (radians, world-space atan2(dirX, dirZ);
            0 = +Z) the viewer faces when the panorama opens.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PanoramaCreate:
      type: object
      required: [title, sourceBlobHash]
      description: |
        Body for POST /api/territories/{slug}/panoramas. The slug is derived
        from the title by the catalog and made unique within the territory —
        it is not client-supplied.
      properties:
        title: { type: string }
        sourceBlobHash: { type: string }
        position: { $ref: '#/components/schemas/Vec3' }
        yawOffset: { type: number, format: double }

    PanoramaUpdate:
      type: object
      properties:
        title: { type: string }
        position: { $ref: '#/components/schemas/Vec3' }
        yawOffset: { type: number, format: double }
        defaultYaw: { type: number, format: double }

    Document:
      type: object
      required: [id, territorySlug, title, sourceBlobHash]
      description: |
        A PDF attached to a territory. Served as-is from BlobStore via
        /api/assets/{sourceBlobHash}; not converted, not anchored in the scene.
      properties:
        id: { type: integer, format: int64 }
        territorySlug: { type: string }
        title: { type: string }
        sourceBlobHash:
          type: string
          description: BlobStore hash for the PDF; served via /api/assets/{hash}.
        createdAt: { type: string, format: date-time }

    DocumentCreate:
      type: object
      required: [title, sourceBlobHash]
      description: Body for POST /api/territories/{slug}/documents.
      properties:
        title: { type: string }
        sourceBlobHash: { type: string }

    EntityCreate:
      type: object
      required: [title, sourceBlobHash]
      description: |
        Body for POST /api/territories and POST /api/models. The client
        first uploads the source ZIP via /api/uploads, then attaches the
        returned hash here. The gateway forwards the entity to catalog
        and queues a conversion job; the response carries both the new
        entity and the queued Job for SSE subscription. The slug is derived
        from the title by the catalog and made unique — not client-supplied.
      properties:
        title: { type: string }
        description: { type: string }
        externalPanoramaUrl: { type: string }
        sourceBlobHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        thumbnailBlobHash:
          type: string
          pattern: '^([0-9a-f]{64})?$'
          description: |
            Optional model thumbnail image blob hash (models only; ignored for
            territories). Upload the image via /api/uploads first.

    ModelUpdate:
      type: object
      description: |
        Body for PATCH /api/models/{slug}. Updates mutable fields only; the
        source archive and conversion are untouched. Omitted fields are left
        unchanged.
      properties:
        thumbnailBlobHash:
          type: string
          pattern: '^([0-9a-f]{64})?$'
          description: New thumbnail blob hash; empty string clears it.

    TerritoryUpdate:
      type: object
      description: |
        Body for PATCH /api/territories/{slug}. Updates mutable fields only;
        the source archive and conversion are untouched. Omitted fields are
        left unchanged.
      properties:
        externalPanoramaUrl: { type: string }

    TerritoryAdmins:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items: { type: string }
          description: Admin user ids assigned to the territory (full set).

    TerritorySourceReplace:
      type: object
      required: [sourceBlobHash]
      description: |
        Body for POST /api/territories/{slug}/source. Carries the hash of a
        freshly uploaded ZIP (via /api/uploads); the territory's source is
        swapped to it and a new conversion is queued.
      properties:
        sourceBlobHash: { type: string, pattern: '^[0-9a-f]{64}$' }

    TerritoryCreated:
      type: object
      required: [territory, job]
      properties:
        territory: { $ref: '#/components/schemas/Territory' }
        job: { $ref: '#/components/schemas/Job' }

    ModelCreated:
      type: object
      required: [model, job]
      properties:
        model: { $ref: '#/components/schemas/Model' }
        job: { $ref: '#/components/schemas/Job' }

    AssetOption:
      type: object
      required: [slug, title, artifacts]
      properties:
        slug: { type: string }
        title: { type: string }
        thumbnailBlobHash:
          type: string
          description: |
            Optional thumbnail image blob hash for the picker. Empty/absent =
            no thumbnail. Fetch from /api/assets/{thumbnailBlobHash}.
        bboxMin:
          $ref: '#/components/schemas/Vec3'
          description: |
            Original (pre-normalize) bounding-box minimum of the source
            mesh. Carried so the frontend can compute a real-size scale
            when dropping a model onto a territory.
        bboxMax:
          $ref: '#/components/schemas/Vec3'
          description: Original (pre-normalize) bounding-box maximum.
        artifacts:
          type: array
          description: |
            All available LODs for this model, sorted by lod ascending.
            Empty when the model has no successful conversion yet — the
            frontend can grey it out in the picker.
          items: { $ref: '#/components/schemas/LodArtifact' }

    SceneBundle:
      type: object
      required: [territory, placements, modelOptions]
      description: |
        Single-shot bundle for the viewer page. Includes the requested
        territory, its current LOD0 artifact (when present), all
        placements on it, and the list of available models with their
        artifacts for the placement picker.
      properties:
        territory: { $ref: '#/components/schemas/Territory' }
        artifact: { $ref: '#/components/schemas/Artifact' }
        placements:
          type: array
          items: { $ref: '#/components/schemas/Placement' }
        modelOptions:
          type: array
          items: { $ref: '#/components/schemas/AssetOption' }
        panoramas:
          type: array
          description: |
            Equirect panoramas anchored to this territory. The viewer
            renders them as toggleable alternate camera modes; placements
            stay shared between the 3D and panorama views.
          items: { $ref: '#/components/schemas/Panorama' }
        documents:
          type: array
          description: PDF documents attached to this territory.
          items: { $ref: '#/components/schemas/Document' }

    UploadInitiate:
      type: object
      required: [size]
      properties:
        size: { type: integer, format: int64, minimum: 1 }
        contentType: { type: string }

    UploadSession:
      type: object
      required: [id, size, offset]
      properties:
        id: { type: string }
        size: { type: integer, format: int64 }
        offset: { type: integer, format: int64 }
        contentType: { type: string }

    UploadFinalized:
      type: object
      required: [hash, size]
      properties:
        hash: { type: string }
        size: { type: integer, format: int64 }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    # --- auth domain ---
    AuthUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        username: { type: string }
        status: { type: string, enum: [active, frozen, deleted] }
        totpEnabled:
          type: boolean
          description: >
            Whether TOTP two-factor auth is on. ABSENT MEANS UNKNOWN — the
            owning service (twofa) could not be reached. Render an absent value
            as "unknown", never as "off": auth-service does not own this flag
            and the gateway overlays it, so a missing key is a failed lookup and
            not a disabled factor.
        passkeyEnabled:
          type: boolean
          description: >
            Whether the user has at least one passkey registered. Absent means
            unknown, exactly as for totpEnabled. Always absent on
            /api/auth/me — that route runs on every page load and deliberately
            does not pay for the lookup, since nothing there consumes it.
        roleSlugs: { type: array, items: { type: string } }
        roleTitles:
          type: object
          additionalProperties: { type: string }
          description: >
            Slug → display title for each entry in roleSlugs. The slug is not an
            abbreviation of the title: slug "admin" is titled "Company Owner"
            while a different role is slugged "owner", so a UI printing the slug
            names the wrong role. A slug absent from the map means the role was
            deleted between reads — fall back to showing the slug.
        permissions: { type: array, items: { type: string } }
        isOwner: { type: boolean }
        onboardingToursSeen: { type: array, items: { type: string } }
        csrfToken: { type: string, description: "echo back as X-CSRF-Token on POST/PUT/PATCH/DELETE; required only for cookie sessions" }
    AuthRole:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        isSystem: { type: boolean }
        permissionSlugs: { type: array, items: { type: string } }
    AuthPermission:
      type: object
      properties:
        slug: { type: string }
        description: { type: string }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: email or username }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        token: { type: string, description: empty when twoFactorRequired }
        twoFactorRequired: { type: boolean }
        challengeToken: { type: string, description: present when 2FA is required }
        csrfToken: { type: string, description: "echo back as X-CSRF-Token on POST/PUT/PATCH/DELETE; required only for cookie sessions" }
    Login2FARequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code: { type: string, description: TOTP or recovery code }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        csrfToken: { type: string, description: "echo back as X-CSRF-Token on POST/PUT/PATCH/DELETE; required only for cookie sessions" }
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
    Setup2FAResponse:
      type: object
      properties:
        secret: { type: string }
        otpauthUrl: { type: string }
    Enable2FARequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    Enable2FAResponse:
      type: object
      properties:
        recoveryCodes: { type: array, items: { type: string } }
    Disable2FARequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    PasskeyBeginResponse:
      type: object
      properties:
        optionsJson: { type: string, description: PublicKey options JSON for navigator.credentials }
        flowId: { type: string }
    PasskeyRegisterFinishRequest:
      type: object
      required: [flowId, credentialJson]
      properties:
        flowId: { type: string }
        credentialJson: { type: string, description: navigator.credentials.create() result JSON }
        name: { type: string }
    PasskeyCredential:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string }
        lastUsedAt: { type: string }
    PasskeyListResponse:
      type: object
      properties:
        credentials: { type: array, items: { $ref: '#/components/schemas/PasskeyCredential' } }
    PasskeyLoginFinishRequest:
      type: object
      required: [flowId, assertionJson]
      properties:
        flowId: { type: string }
        assertionJson: { type: string, description: navigator.credentials.get() result JSON }
    PasskeyDeleteRequest:
      type: object
      properties:
        password: { type: string, format: password, description: sent when 2FA is off }
        code: { type: string, description: TOTP or recovery code, sent when 2FA is on }
    CreateUserRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string }
        username: { type: string }
        password: { type: string, format: password }
        roleSlugs: { type: array, items: { type: string } }
    UpdateUserRequest:
      type: object
      properties:
        roleSlugs: { type: array, items: { type: string }, description: replaces the user's roles }
        email: { type: string }
        username: { type: string }
    CreateRoleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        slug: { type: string, description: "optional; derived from the title when omitted" }
        permissionSlugs: { type: array, items: { type: string } }
    UpdateRoleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
    SetRolePermissionsRequest:
      type: object
      required: [permissionSlugs]
      properties:
        permissionSlugs: { type: array, items: { type: string } }

    MetricPoint:
      type: object
      required: [t, v]
      properties:
        t: { type: number, format: double, description: Unix timestamp in seconds }
        v: { type: number, format: double, description: Sample value }

    MetricSeries:
      type: object
      required: [label, points]
      properties:
        label: { type: string, description: Series label derived from the Prometheus metric labels }
        points:
          type: array
          items: { $ref: '#/components/schemas/MetricPoint' }
        labels:
          type: object
          additionalProperties: { type: string }
          description: >
            Raw Prometheus labels. Only the alerts panel needs them (to tell
            firing from pending); chart panels ignore them. Omitted when empty.

    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok, not_ready, degraded] }
        service: { type: string }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
          description: Per-probe result; present on /readyz when probes are registered.

    AuditEntry:
      type: object
      required: [id, at, action, entity, result]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actorId:
          type: string
          description: Empty for a system change (mesh-worker, migrations).
        actorLogin:
          type: string
          description: >
            Login behind actorId, resolved on read. Empty for a system change,
            for a user since deleted, or if auth could not be reached — the
            journal answers with ids rather than failing.
        companyId:
          type: string
          description: Empty for a Root or system change.
        companyLogin:
          type: string
          description: >
            Login behind companyId. The company key is the owning user's id, so
            this is that user's login. Empty under the same conditions as
            actorLogin.
        action: { type: string, description: "e.g. territory.update, auth.login" }
        entity: { type: string }
        entityId: { type: string }
        entityLabel:
          type: string
          description: Slug or email as of the event; survives the row's deletion.
        oldRow:
          type: string
          description: Raw JSON snapshot before the change; empty on insert. The client derives the diff.
        newRow:
          type: string
          description: Raw JSON snapshot after the change; empty on delete.
        territorySlug:
          type: string
          description: >
            Slug of the parent territory, for the entities whose row carries one
            (placement, panorama, document, territory_assignment). Read out of
            the row snapshot and resolved on read. Empty for everything else,
            including a territory entry — that one already carries its own slug
            in entityLabel.
        result: { type: string, enum: [ok, failed] }

    AuditActor:
      type: object
      required: [id]
      properties:
        id: { type: string, description: Actor's user id; the value to filter by. }
        login:
          type: string
          description: Empty if the user has since been deleted.

    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor:
          type: integer
          format: int64
          description: Pass back as `cursor` for the next page. Absent or 0 means this was the last page.
        refs:
          type: object
          additionalProperties:
            type: string
          description: >
            Human-readable names for the ids inside oldRow/newRow, keyed
            "<field>:<value>" — e.g. "role_id:9b75ebfc-…": "Редактор". Keyed by
            value because a changed field needs a name on both sides of the
            arrow; the field name alone carries the kind, so no client-side
            table of field kinds is needed. An id nobody could name is absent,
            and the client falls back to showing the id. Absent entirely on the
            CSV export, which prints no snapshots.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from POST /api/auth/login

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid session token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /api/audit:
    get:
      operationId: listAudit
      summary: Read the company's audit journal
      description: >
        Root sees every entry; anyone else sees only their own company's, keyed
        to the created_by chain. The tenant filter comes from the session, never
        from a parameter. Requires the audit:read permission (Root bypasses it).
        Paging is by cursor over descending id, so pages stay stable while new
        entries land above them.

        audit:read_own does not reach this route. It opens GET /api/audit/mine
        instead — the two journals are separate routes so that "whose rows"
        follows from which one was called, not from which grant the caller
        happens to hold.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          schema: { type: string }
          description: Filter by acting user id.
        - name: action
          in: query
          schema: { type: string }
          description: Exact action, e.g. territory.update.
        - name: entity
          in: query
          schema: { type: string }
          description: Exact entity kind, e.g. territory.
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
          description: nextCursor from the previous page; omit for the newest page.
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
          description: Page size, default 50, clamped to 200.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/audit/mine:
    get:
      operationId: listMyAudit
      summary: Read your own actions
      description: >
        The caller's own entries, newest first. The actor comes from the session
        and this route accepts no actor parameter at all — so there is nothing
        to merge and nothing to forget to overwrite, and it cannot be talked
        into showing somebody else's rows whatever the caller holds. That is the
        whole reason it exists separately from GET /api/audit, whose scope is
        the company.

        Requires audit:read_own or audit:read. Root is pinned to its own actions
        here too rather than given every row: the page means "what I did".
      tags: [audit]
      parameters:
        - name: action
          in: query
          schema: { type: string }
          description: Exact action, e.g. territory.update.
        - name: entity
          in: query
          schema: { type: string }
          description: Exact entity kind, e.g. territory.
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
          description: nextCursor from the previous page; omit for the newest page.
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
          description: Page size, default 50, clamped to 200.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/audit/actors:
    get:
      operationId: listAuditActors
      summary: List the actors present in the caller's slice of the journal
      description: >
        Backs the journal's actor filter. Returns everyone whose entries the
        caller can see, not merely those on the page currently loaded, so an
        actor further down the journal is still selectable. Scope comes from the
        session, exactly as for GET /api/audit. Requires audit:read.
      tags: [audit]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditActor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/audit.csv:
    get:
      operationId: exportAuditCSV
      summary: Export the audit journal as CSV
      description: >
        Same filters and same scoping as GET /api/audit, streamed as CSV until
        the journal is exhausted rather than one page at a time. Served outside
        the JSON middleware chain: the ETag middleware hashes the whole response
        body, which would mean buffering the entire export.
      tags: [audit, audit-export]
      parameters:
        - name: actor
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: entity
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
          description: Start the export below this id; omit to export from the newest entry.
      responses:
        '200':
          description: CSV stream
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

