groups:
  - name: andrey-core
    # 30s, а не 1m: при минутном интервале алерт с `for: 1m` подтверждается
    # только на втором вычислении, и упавший сервис всплывает через две-три
    # минуты. Восемь правил считаются мгновенно, платить минутой лишней
    # слепоты не за что.
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up{job="services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A service target is down"

      # Только серверные сбои — коды, которые gRPC переводит в HTTP 5xx.
      # Отказ (просроченная сессия, неверный пароль, 404, троттлинг) — это
      # сервис работает; при малом трафике один такой отказ давал >5 %.
      # Тот же селектор, что у панели red-errors (gateway registry.go).
      - alert: HighGrpcErrorRate
        expr: sum by (service)(rate(grpc_server_handled_total{grpc_code=~"Unknown|DeadlineExceeded|Unimplemented|Internal|Unavailable|DataLoss"}[5m])) / clamp_min(sum by (service)(rate(grpc_server_handled_total[5m])),0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "gRPC server-fault rate above 5%"

      - alert: HighHttp5xxRate
        expr: sum(rate(http_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])),0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate above 5%"

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, sum by (le,grpc_service)(rate(grpc_server_handling_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "gRPC p99 latency above 2s"

      - alert: ConversionFailures
        expr: rate(mesh_conversions_total{status="failed"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mesh conversions are failing"

      - alert: MemoryGrowth
        expr: process_resident_memory_bytes > 1.5e9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A service is using over 1.5GB RSS"

      - alert: QueueBacklog
        expr: mesh_queue_depth >= 16
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "16 or more conversion jobs queued for 10m (stream backlog)"

      - alert: AuditJournalGrowth
        expr: audit_log_bytes > 5e9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Audit journal above 5GB — revisit the keep-forever retention policy"

      # Critical rather than warning: when this fires the digest chain exists
      # only inside the database it is supposed to prove untampered, which is
      # the one state where the whole mechanism protects nobody.
      - alert: AuditDigestWitnessFailing
        expr: increase(audit_digest_write_failures_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Checkpoint digests are not reaching the witness file"

      - alert: LoginFailureSpike
        expr: rate(auth_logins_total{status="failed"}[5m]) * 60 > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Login failures above 30/min (possible brute force)"

      # for: 2m, not 1m: a Postgres restart during deploy drops readiness for
      # a few seconds, and a one-minute window would page on every deploy —
      # which trains the reader to mute the alert, the same as no receiver.
      - alert: ServiceNotReady
        expr: service_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is up but not ready"
          description: "Its dependency probe has been failing for two minutes. TargetDown cannot see this: the process is alive and /metrics answers."

  # The host disk. There is no node_exporter by decision: asset-service exports
  # the free and total bytes of the filesystem under its blob volume
  # (blobstore_fs_*, statfs at scrape time). blob-data, postgres-data, docker
  # images and logs share one root filesystem on prod, so these describe the
  # whole disk. Free is Bavail, i.e. what a non-root writer can use.
  # Alertmanager has a single route, so warning and critical both reach Telegram.
  # Its message prints only `summary`, so the number goes there.
  - name: andrey-disk
    interval: 1m
    rules:
      # 15 %: on the 119 GB prod disk that is about 18 GB, a few full meshes
      # of backfill away and still enough time to act. for: 10m ignores a
      # momentary dip (a temp file during a deploy, an image pull).
      - alert: DiskSpaceLow
        expr: blobstore_fs_free_bytes / blobstore_fs_size_bytes < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk below 15% free ({{ $value | humanizePercentage }} left)"
          description: "{{ with query \"blobstore_fs_free_bytes\" }}{{ . | first | value | humanize1024 }}B{{ end }} free on the filesystem holding blob-data, Postgres and docker. There is no blob GC, so this only grows."

      # 5 %: about 6 GB. Postgres and the upload stage stop working before
      # the disk is literally full, so this is the last useful moment.
      # Highest severity in this file is critical.
      - alert: DiskSpaceCritical
        expr: blobstore_fs_free_bytes / blobstore_fs_size_bytes < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk below 5% free ({{ $value | humanizePercentage }} left)"
          description: "{{ with query \"blobstore_fs_free_bytes\" }}{{ . | first | value | humanize1024 }}B{{ end }} free. Writes to Postgres and blob-data are about to fail."

      # Extrapolates the last 6 h one day ahead, so it warns while there is
      # still time, well before the percentage rules. 6 h is long enough to
      # smooth out a single upload; for: 30m keeps one steep slope from paging.
      # A legitimate burst (the mesh backfill writes ~3x LOD0 in a few hours)
      # can trip it once even though the disk has room: check the free bytes,
      # and expect it to clear by itself once the slope flattens.
      - alert: DiskFillingUp
        expr: predict_linear(blobstore_fs_free_bytes[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk projected to be full within 24h at the current rate"
          description: "{{ with query \"blobstore_fs_free_bytes\" }}{{ . | first | value | humanize1024 }}B{{ end }} free now. A one-off bulk write (mesh backfill) can cause this once."

      # Without this the three rules above go quiet if asset-service stops
      # exporting or statfs fails: no series, no comparison, no alert. That
      # is exactly how audit-service went unmonitored. asset-service exports
      # on every start, so a healthy stack (prod or compose) never trips it.
      - alert: DiskMetricMissing
        expr: absent(blobstore_fs_free_bytes)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No disk metric: the DiskSpace alerts are blind"
          description: "asset-service is not exporting blobstore_fs_free_bytes (down, unscraped, or statfs failing; see its log)."
