name: desktop

on:
  # Manual runs are how you get installers without cutting a tag: trigger this
  # from the Actions tab and download them from the run's Artifacts section.
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    # The SPA is no longer embedded — the shell loads it from production — so a
    # frontend change cannot break this build.
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: desktop/yarn.lock
      - run: yarn --cwd desktop install --frozen-lockfile
      - run: make -C desktop check
      # Electron ships inside every installer, so its advisories matter even
      # though it is a devDependency: audit every group, fail on high.
      - run: yarn --cwd desktop audit --level high

  build:
    needs: check
    # The default workflow token is read-only; creating a release needs write.
    # Granted here rather than repo-wide so check keeps the read-only default.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # dmg + zip for arm64 and x64: macos-latest builds both arches.
          - os: macos-latest
            expect: 4
          # 22.04: the oldest glibc the AppImage then runs on. AppImage + deb.
          - os: ubuntu-22.04
            expect: 2
          # NSIS setup + portable exe.
          - os: windows-latest
            expect: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: desktop/yarn.lock
      - run: yarn --cwd desktop install --frozen-lockfile

      # The tag has to agree with package.json's version, or a release called
      # v0.4.0 ships files called 0.3.0. Checked before the build, so a wrong tag
      # costs seconds instead of three builds.
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "desktop-v${version}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match desktop/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # electron-builder.yml sets mac.identity "-", which signs ad-hoc whatever
      # auto-discovery finds (Apple Silicon refuses an unsigned arm64 binary).
      # CSC_FOR_PULL_REQUEST: the builder skips signing on pull_request runs, and
      # a PR's arm64 artifact would then not launch. No certificate is configured
      # on any runner, so nothing but the ad-hoc signature is applied.
      - run: yarn --cwd desktop dist
        env:
          CSC_FOR_PULL_REQUEST: "true"

      # Names come from electron-builder.yml's artifactName. Exactly the expected
      # set per OS: anything else means the builder wrote somewhere these globs
      # do not look, and silently publishing less is what this catches. The
      # globs stop at the extension, so *.blockmap, latest*.yml and
      # builder-debug.yml never match.
      - shell: bash
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in desktop/release/Andrey-*.dmg desktop/release/Andrey-*.zip desktop/release/Andrey-*.exe desktop/release/Andrey-*.AppImage desktop/release/Andrey-*.deb; do
            mv "$f" dist/
          done
          count=$(ls -1 dist | wc -l | tr -d ' ')
          [ "$count" -eq "$EXPECT" ] || { echo "::error::expected $EXPECT installers, found $count"; ls -la dist desktop/release; exit 1; }
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: andrey-desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # Only a tag publishes; a pull request cannot, whatever it does to this
      # file. The three matrix jobs all target the same release and finish at
      # different times, so the action has to create-or-update rather than
      # create.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # The tag is `desktop-v0.4.0`; the title says `Andrey Desktop v0.4.0`.
          name: Andrey Desktop v${{ steps.meta.outputs.version }}
          files: dist/*
          draft: false
          body: |
            Desktop client for the 3D viewer. Loads production
            (`https://andrey.vbncursed.fun`) — sign in with your normal account.
            Territories you save with **Save offline** open without a network.

            **These builds are not code-signed, and every OS will object.**

            **macOS** - `Andrey-*-macos-arm64` for Apple Silicon, `Andrey-*-macos-x64`
            for Intel (each as `.dmg` and `.zip`).
            1. Open the dmg (or unzip) and drag Andrey to `/Applications`.
            2. The first launch is blocked as *"damaged"* or *"cannot be
               opened"*. The file is fine. Run
               `xattr -dr com.apple.quarantine /Applications/Andrey.app`,
               or try to open the app once, then go to System Settings, Privacy &
               Security, and press *Open Anyway* (it appears only after that blocked
               attempt and stays for about an hour).
            3. On first launch, and after every update, macOS asks for the
               Keychain item "Andrey Safe Storage". Allow it (*Always Allow*);
               it holds the key that encrypts your sign-in cookie.

            **Windows** - `Andrey-*-windows-x64-setup.exe` or
            `Andrey-*-windows-x64-portable.exe`. SmartScreen says "Windows
            protected your PC": press *More info*, then *Run anyway*. The
            portable `.exe` needs no install and shares its data with the
            installed version.

            **Linux** - `Andrey-*-linux-x86_64.AppImage` or
            `Andrey-*-linux-amd64.deb`.
            - AppImage: `chmod +x Andrey-*.AppImage && ./Andrey-*.AppImage`.
              Ubuntu 22.04 and newer may need `sudo apt install libfuse2`.
            - deb: `sudo apt install ./Andrey-*.deb`.
            - Without libsecret or KWallet (a keyring) the sign-in cookie is
              only obfuscated, not encrypted.

            Sign-in: keep "Keep me signed in on this device" ticked, or you are
            signed out every time the app closes.

            There is no auto-update; check back here for newer builds.
