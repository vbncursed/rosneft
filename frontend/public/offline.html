<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No connection — Andrey 3D Viewer</title>
    <!-- Standalone document the service worker serves offline: it carries its own
         styles inline and needs no JS, because the app bundle isn't reachable
         without the network. -->
    <style>
      body { margin: 0; }
      .offline-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #ffffff;
        color: #171717;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .offline-screen { background: #0a0a0a; color: #ededed; }
      }
      .offline-screen h1 { margin: 0; font-size: 1.25rem; font-weight: 500; }
      .offline-screen p { margin: 0; max-width: 24rem; font-size: 0.875rem; opacity: 0.7; }
      .offline-retry {
        border: 1px solid currentColor;
        border-radius: 0.25rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="offline-screen">
      <h1>No connection</h1>
      <p>
        This app needs a connection — territories and models load from the server.
        Check your network and try again.
      </p>
      <!-- Plain <a>: a full document request lets the service worker retry the
           network. There is no router here — the JS bundle never loaded. -->
      <a class="offline-retry" href="/">Retry</a>
    </main>
  </body>
</html>
