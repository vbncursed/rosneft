server {
    server_name andrey.vbncursed.fun;

    # Body size for chunked uploads ( accepts large payloads).
    client_max_body_size 0;

    # The frontend is a static Vite SPA (no Node runtime since the Next.js
    # cutover). Built assets are rsynced to /var/www/andrey.
    root /var/www/andrey;
    index index.html;

    # Inherited by every location that declares no add_header of its own:
    # both /api/ blocks, the SSE stream and the SPA fallback. The two that do
    # declare one re-include it below — see the snippet's header comment.
    include snippets/security-headers.conf;

    # SSE conversion stream — buffering must stay off so frames flush in
    # real time. Long-lived stream → big read timeout.
    location ~ ^/api/jobs/.+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # Straight to the gateway now — the Next.js BFF on :3000 is gone.
    location /api/ {
        # burst=60 nodelay: the SPA fires several requests on first paint and
        # chunked upload sends frequent PATCHes. A burst tight enough to bite
        # during normal use is worse than no limit — it gets removed by
        # whoever is on call.
        limit_req zone=rosneft_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
    }

    # Credential-guessing endpoints only — not every /api/auth/* route. 2FA
    # and passkey *management* (setup/enable/disable, register/*,
    # credentials) already require an existing session, so a brute-force
    # limit buys nothing there and only throttles legitimate use (the
    # account page re-fetches passkey/credentials on every mount). What
    # belongs here is: the two ways to present a password or a stolen
    # session and be told yes/no. me/password takes oldPassword +
    # newPassword and is the one exception that needs a session to reach —
    # change_password.go never calls the login-lockout store, so without a
    # limit here a hijacked session can brute-force the current password at
    # the general /api/ rate with no backstop anywhere in the stack.
    # Anchored at both ends (^...$) so a future /api/auth/loginX or
    # /api/auth/logout can never fall into this set by accident.
    #
    # A regex location beats a prefix location regardless of file order, so
    # this takes precedence over /api/ above for the paths it matches — but
    # that also means it inherits nothing from /api/: nginx has no location
    # inheritance, so proxy_pass and every proxy_set_header are repeated
    # here, or these requests would reach the gateway missing them. The path
    # itself (/api/auth/...) can never match the SSE regex above
    # (/api/jobs/.../events), so the two never contend for the same request.
    location ~ ^/api/auth/(login(/2fa)?|passkey/login/(begin|finish)|me/password)$ {
        # 5 a minute per address. auth-service already locks an account
        # after five failed logins, but that counts per user; this counts
        # per address and fires before the request reaches Go at all.
        limit_req zone=rosneft_login burst=5;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
    }

    # Vite hashes every filename in /assets, so these can never go stale.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
    }

    # The shell must be revalidated on every load: it names the hashed bundles,
    # and a cached copy would point at files the next deploy has already removed.
    # try_files in location / falls back here by internal redirect, so every
    # client-side route is answered from this block — it is the only place the
    # shell's headers can be set. (Proof: the live site returns
    # Cache-Control: no-cache on /territories, and nothing else sets it.)
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/security-headers.conf;
    }

    # SPA fallback — client-side routes have no file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/andrey.vbncursed.fun/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/andrey.vbncursed.fun/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = andrey.vbncursed.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name andrey.vbncursed.fun;
    return 404; # managed by Certbot


}
