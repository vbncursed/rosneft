name: desktop

on:
  # Manual runs are how you get installers without cutting a tag: trigger this
  # from the Actions tab and download them from the run's Artifacts section.
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/desktop.yml"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # webkit2gtk and its friends are what tauri links against; without them
      # cargo fails at link time, not at compile time, which reads as a mystery.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri::generate_context!() embeds frontendDist at Rust compile time, so
      # cargo fmt/clippy/test all need a built frontend/dist to exist first —
      # not just `cargo tauri build` (that's the `build` job below).
      - run: yarn --cwd frontend install --frozen-lockfile
      - run: yarn --cwd frontend build
      - run: make -C desktop check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: yarn --cwd frontend install --frozen-lockfile
      # Explicit, because tauri.conf.json declares no beforeBuildCommand:
      # tauri resolves it against projectPath (desktop/) while the config
      # itself lives a level deeper, so any relative path there is correct
      # for exactly one of the two ways this gets invoked.
      - run: yarn --cwd frontend build
      # No tagName/releaseId: this only builds and packages, it does not
      # create or upload to a GitHub Release. The icons are placeholders
      # (see desktop/README.md) and there is no updater signing key, so a
      # matrix build here is a packaging smoke test, not a publishable
      # artifact — release automation is out of scope for this task.
      # tagName is what turns this from a build into a publish: without it
      # tauri-action never touches Releases. It is set only on a tag push, so
      # a PR run still just builds — a pull request must not be able to
      # publish anything.
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Andrey Desktop {0}', github.ref_name) || '' }}
          releaseDraft: false
          releaseBody: |
            Desktop client for the 3D viewer. Points at production
            (`https://andrey.vbncursed.fun`) — sign in with your normal account.

            **These builds are not code-signed, and every OS will object.**

            - **macOS** reports an unsigned app as *"damaged and can't be
              opened"*. The message is misleading — the file is fine. After
              dragging it to `/Applications`, run:
              `xattr -dr com.apple.quarantine /Applications/Andrey.app`
            - **Windows** shows SmartScreen: *More info → Run anyway*.
            - **Linux** needs `chmod +x` on the `.AppImage`. If a scene runs at
              a crawl, try `WEBKIT_DISABLE_DMABUF_RENDERER=1` — WebKitGTK falls
              back to software rendering on some drivers.

            There is no auto-update; check back here for newer builds.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Without this the installers are built and then thrown away with the
      # runner. They are unsigned, so treat a download as a smoke test, not a
      # release — see desktop/README.md for what each OS does to an unsigned
      # bundle and how to get past it.
      - uses: actions/upload-artifact@v7
        with:
          name: andrey-desktop-${{ matrix.os }}
          # Every OS produces exactly one of these; the other two globs match
          # nothing, and if-no-files-found only fires when all of them do.
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
