appId: fun.vbncursed.andrey.desktop
productName: Andrey
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
publish: null

# Electron ships every fuse at its permissive default. Cookie encryption is what
# puts the session cookie behind the OS keychain/DPAPI/keyring; the rest close
# ways to turn the signed binary into a Node shell or attach a debugger.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # "-" is the ad-hoc fallback: Apple Silicon refuses an arm64 binary with no
  # signature at all. When CSC_LINK carries the self-signed certificate, the
  # `sign` hook (src/signing.ts) signs with it instead: the builder's own lookup
  # uses `find-identity -v`, which hides an untrusted certificate. Not a Developer
  # ID — Gatekeeper still needs the xattr step (README).
  identity: "-"
  sign: ./dist/signing.js
  # No notarization, so the hardened runtime buys nothing — and with an ad-hoc
  # signature its library validation can refuse to load Electron's own frameworks.
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Andrey-${version}-macos-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Andrey-${version}-windows-x64-setup.${ext}
portable:
  artifactName: Andrey-${version}-windows-x64-portable.${ext}

linux:
  icon: build/icon.png
  category: Graphics
  maintainer: vbncursed <vbncursed@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  artifactName: Andrey-${version}-linux-x86_64.${ext}
deb:
  artifactName: Andrey-${version}-linux-amd64.${ext}
