# Four ecosystems, because the repository has four and none of them were
# watched. github-actions is the one that is easy to forget and the reason this
# file exists at all: the action versions in desktop.yml had to be checked by
# hand to notice softprops/action-gh-release had gone from v2 to v3.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Minor and patch as one PR; majors stay separate because on this project
      # they are never routine — typescript 6→7 forced a linter replacement.
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # One entry per module: go.work does not make twelve modules one target, and
  # a glob keeps this from having to be edited every time a service is added.
  - package-ecosystem: gomod
    directories:
      - /backend/pkg
      - /backend/proto
      - /backend/services/*
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
