groups:
  - name: andrey-core
    # 30s, а не 1m: при минутном интервале алерт с `for: 1m` подтверждается
    # только на втором вычислении, и упавший сервис всплывает через две-три
    # минуты. Восемь правил считаются мгновенно, платить минутой лишней
    # слепоты не за что.
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up{job="services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A service target is down"

      - alert: HighGrpcErrorRate
        expr: sum by (service)(rate(grpc_server_handled_total{grpc_code!="OK"}[5m])) / clamp_min(sum by (service)(rate(grpc_server_handled_total[5m])),0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "gRPC error rate above 5%"

      - alert: HighHttp5xxRate
        expr: sum(rate(http_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])),0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate above 5%"

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, sum by (le,grpc_service)(rate(grpc_server_handling_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "gRPC p99 latency above 2s"

      - alert: ConversionFailures
        expr: rate(mesh_conversions_total{status="failed"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mesh conversions are failing"

      - alert: MemoryGrowth
        expr: process_resident_memory_bytes > 1.5e9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A service is using over 1.5GB RSS"

      - alert: QueueBacklog
        expr: mesh_queue_depth >= 16
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mesh worker pulling full batches for 10m (stream backlog)"

      - alert: AuditJournalGrowth
        expr: audit_log_bytes > 5e9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Audit journal above 5GB — revisit the keep-forever retention policy"

      # Critical rather than warning: when this fires the digest chain exists
      # only inside the database it is supposed to prove untampered, which is
      # the one state where the whole mechanism protects nobody.
      - alert: AuditDigestWitnessFailing
        expr: increase(audit_digest_write_failures_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Checkpoint digests are not reaching the witness file"

      - alert: LoginFailureSpike
        expr: rate(auth_logins_total{status="failed"}[5m]) * 60 > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Login failures above 30/min (possible brute force)"

      # for: 2m, not 1m: a Postgres restart during deploy drops readiness for
      # a few seconds, and a one-minute window would page on every deploy —
      # which trains the reader to mute the alert, the same as no receiver.
      - alert: ServiceNotReady
        expr: service_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is up but not ready"
          description: "Its dependency probe has been failing for two minutes. TargetDown cannot see this: the process is alive and /metrics answers."
