syntax = "proto3";

package rosneft.auth.v1;

option go_package = "github.com/vbncursed/rosneft/backend/proto/gen/go/rosneft/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

// AuthService owns users, roles, permissions, sessions, and 2FA. Sessions
// are opaque tokens stored in Redis; everything else in Postgres. The gateway
// is the only caller.
service AuthService {
  // --- session / login ---
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc LoginVerify2FA(LoginVerify2FARequest) returns (LoginResponse);
  rpc PasskeyLoginBegin(PasskeyLoginBeginRequest) returns (PasskeyLoginBeginResponse);
  rpc PasskeyLoginFinish(PasskeyLoginFinishRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // --- self ---
  rpc GetMe(GetMeRequest) returns (User);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // VerifyPassword checks the caller's password without changing it — the
  // password step-up factor for sensitive self-service actions.
  rpc VerifyPassword(VerifyPasswordRequest) returns (VerifyPasswordResponse);
  // MarkTourSeen records that one first-run tour was finished or skipped.
  rpc MarkTourSeen(MarkTourSeenRequest) returns (MarkTourSeenResponse);

  // --- user admin ---
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // ResolveUserLogins labels ids the caller already sees. It applies no
  // created_by scope, unlike ListUsers and GetUser: that scope does not line up
  // with the audit journal's own, and the mismatch is what made a user's own
  // actions appear under a raw uuid. A valid token is still required, so the
  // call needs a real session rather than only network reach.
  rpc ResolveUserLogins(ResolveUserLoginsRequest) returns (ResolveUserLoginsResponse);
  rpc GetUser(GetUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc FreezeUser(FreezeUserRequest) returns (User);
  rpc UnfreezeUser(UnfreezeUserRequest) returns (User);
  rpc SoftDeleteUser(SoftDeleteUserRequest) returns (SoftDeleteUserResponse);
  rpc RestoreUser(RestoreUserRequest) returns (User);
  rpc SetUserOwner(SetUserOwnerRequest) returns (User);

  // --- roles / permissions ---
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (Role);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  // ResolveLabels names roles and permissions the caller already sees. Like
  // ResolveUserLogins it applies no company scope: the ids arrive from journal
  // snapshots the reader's own scope already released, so naming a visible id
  // discloses nothing further. Unlike ListRoles, which addresses roles by slug,
  // this one takes the uuid the snapshot actually carries — Role and Permission
  // deliberately carry no id, so neither listing can serve this.
  rpc ResolveLabels(ResolveLabelsRequest) returns (ResolveLabelsResponse);
}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string status = 4; // active|frozen|deleted
  bool totp_enabled = 5;
  repeated string role_slugs = 6;
  repeated string permissions = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  bool is_owner = 10; // root of trust: manages admins, grants owner, bypasses grant limits
  repeated string onboarding_tours_seen = 11; // ids of the first-run tours already finished or skipped
}

message Role {
  string slug = 1;
  string title = 2;
  bool is_system = 3;
  repeated string permission_slugs = 4;
}

message Permission {
  string slug = 1;
  string description = 2;
}

message LoginRequest {
  string identifier = 1;
  string password = 2;
}
// LoginResponse carries a session token on success, OR a challenge when 2FA
// is required (token empty, two_factor_required=true, challenge_token set).
message LoginResponse {
  string token = 1;
  bool two_factor_required = 2;
  string challenge_token = 3;
}
message LoginVerify2FARequest {
  string challenge_token = 1;
  string code = 2;
}

// Passkey passwordless login. Begin returns discoverable-login options + a
// flow id; Finish exchanges a signed assertion for a session token. Verification
// is delegated to passkey-service; auth mints the session (LoginResponse.token).
message PasskeyLoginBeginRequest {}
message PasskeyLoginBeginResponse {
  string options_json = 1;
  string flow_id = 2;
}
message PasskeyLoginFinishRequest {
  string flow_id = 1;
  string assertion_json = 2;
}

message LogoutRequest {
  string token = 1;
}
message LogoutResponse {}

message ValidateTokenRequest {
  string token = 1;
}
message ValidateTokenResponse {
  string user_id = 1;
  repeated string permissions = 2;
  bool is_owner = 3; // root of trust; gateway grants it a blanket route bypass
  string owning_admin_id = 4; // tenant admin for territory scoping; "" for Root
  // Unmangled ResolveOwningAdmin result — the audit log's company key. Differs
  // from owning_admin_id for guests, whose territory scope is keyed to self.
  string audit_company_id = 5;
}

message GetMeRequest {
  string token = 1;
}
message ChangePasswordRequest {
  string token = 1;
  string old_password = 2;
  string new_password = 3;
}
message ChangePasswordResponse {}
message MarkTourSeenRequest {
  string token = 1;
  string tour = 2;
}
message MarkTourSeenResponse {}
message VerifyPasswordRequest {
  string token = 1;
  string password = 2;
}
message VerifyPasswordResponse {
  bool valid = 1;
}

message CreateUserRequest {
  string token = 1; // actor session token; created_by is set from it
  string email = 2;
  string username = 3;
  string password = 4;
  repeated string role_slugs = 5;
}
message ListUsersRequest {
  string token = 1; // actor; scopes the result to owned users unless actor has users:read_all
  string status = 2;
  bool include_deleted = 3;
}
message ListUsersResponse {
  repeated User users = 1;
}
message ResolveUserLoginsRequest {
  string token = 1; // validated, but its created_by scope is deliberately not applied
  repeated string ids = 2; // at most 500; a malformed id is refused, not ignored
}
message ResolveUserLoginsResponse {
  // Ids that match nothing are absent rather than empty: the journal remembers
  // deleted users, so the caller falls back to showing the uuid.
  map<string, string> logins = 1;
}

// LabelRef is one id to name. kind is "role" or "permission".
message LabelRef {
  string kind = 1;
  string id = 2;
}
message ResolveLabelsRequest {
  string token = 1; // validated; its company scope is deliberately not applied
  // At most 500. A kind this service does not know is dropped rather than
  // refused, so a rolling deploy cannot blank a whole page of labels.
  repeated LabelRef refs = 2;
}
message ResolveLabelsResponse {
  // Keyed "<kind>:<id>". Refs that match nothing are absent — the journal
  // remembers roles that have since been deleted.
  map<string, string> labels = 1;
}
message GetUserRequest {
  string token = 1;
  string id = 2;
}
message UpdateUserRequest {
  string token = 1;
  string id = 2;
  repeated string role_slugs = 3; // replaces the user's roles when set
  string email = 4;               // empty = unchanged
  string username = 5;            // empty = unchanged
}
message FreezeUserRequest {
  string token = 1; // actor resolved server-side from the session, never trusted from the client
  string id = 2;
}
message UnfreezeUserRequest {
  string token = 1;
  string id = 2;
}
message SoftDeleteUserRequest {
  string token = 1; // actor resolved server-side from the session
  string id = 2;
}
message SoftDeleteUserResponse {}
message RestoreUserRequest {
  string token = 1;
  string id = 2;
}
// SetUserOwnerRequest grants/revokes the owner flag. Only an existing owner may
// call it (enforced server-side from the session token).
message SetUserOwnerRequest {
  string token = 1; // actor; must already be an owner
  string id = 2;
  bool is_owner = 3;
}

message ListRolesRequest {
  string token = 1; // actor; scopes visible roles to the caller's group
}
message ListRolesResponse {
  repeated Role roles = 1;
}
message CreateRoleRequest {
  string slug = 1;
  string title = 2;
  repeated string permission_slugs = 3;
  string token = 4; // actor; a non-owner may only grant permissions it holds
}
message UpdateRoleRequest {
  string slug = 1;
  string title = 2;
  string token = 3; // actor; only the role's group (or Root) may rename it
}
message DeleteRoleRequest {
  string slug = 1;
  string token = 2; // actor; only the role's group (or Root) may delete it
}
message DeleteRoleResponse {}
message SetRolePermissionsRequest {
  string slug = 1;
  repeated string permission_slugs = 2;
  string token = 3; // actor; a non-owner may only grant permissions it holds
}
message ListPermissionsRequest {}
message ListPermissionsResponse {
  repeated Permission permissions = 1;
}
