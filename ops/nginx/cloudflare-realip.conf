# ops/nginx/cloudflare-realip.conf → /etc/nginx/snippets/cloudflare-realip.conf
#
# Every request reaches nginx through Cloudflare, so $remote_addr is a
# Cloudflare edge address, not the visitor: without this, limit_req buckets
# every user of one edge node into a single queue (the login zone then
# delays a begin/finish or password/2FA pair by ~12 s). The visitor's address
# is in CF-Connecting-IP, and it is trusted only when the TCP peer is one of
# Cloudflare's own ranges, so a request that reaches the origin directly
# cannot forge it.
#
# Included from the rosneft server block only (not conf.d), so the unrelated
# simpa-bot vhost on this nginx is untouched.
#
# Ranges: https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-10-29).
# They change rarely; refresh this file when Cloudflare announces a change.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
