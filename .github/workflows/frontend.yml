name: frontend

# The SPA (formerly frontend-v2, which replaced the old frontend/ on
# 2026-09-17): lint, vitest with coverage thresholds, the production build and
# a production-dependency audit — the same yarn scripts a developer runs.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [dev]
  workflow_dispatch:
  # deploy.yml runs this as its gate on main; main is not listed under `push`
  # so the same checks do not run twice there.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `defaults.run.working-directory` above applies to `run` steps only,
      # so every action still takes repo-root-relative paths.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # package.json's packageManager field picks the Yarn release. After
      # setup-node, so the shim lands beside the Node this job runs. Node 25+ no
      # longer ships corepack, so it is installed first (pinned like every tool here).
      - run: npm install -g corepack@0.36.0
      - run: corepack enable

      - run: yarn install --immutable

      # tsc -b --noEmit && oxlint --type-aware && oxfmt --check.
      - run: yarn lint

      # vitest with coverage thresholds (90/85/90/90 in vite.config.ts) — it
      # fails the job when they drop, so it replaces a plain `yarn test`.
      - run: yarn test:coverage

      # Build last: it is the slowest and the least likely to be the thing
      # that broke. .env.production pins VITE_API_URL empty; without it every
      # API call in the bundle goes to `undefined/api/...` and nothing warns.
      - run: yarn build

      # Production dependencies only, transitive ones included; fails on high
      # or critical.
      - run: yarn npm audit --recursive --environment production --severity high
