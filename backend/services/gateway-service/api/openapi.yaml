          application/json:
            schema: { $ref: '#/components/schemas/UploadInitiate' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/uploads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    head:
      operationId: getUploadStatus
      summary: Query the current offset of a session
      tags: [uploads]
      responses:
        '200':
          description: OK
          headers:
            Upload-Offset:
              schema: { type: integer, format: int64 }
            Upload-Length:
              schema: { type: integer, format: int64 }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      operationId: appendUploadChunk
      summary: Append bytes to a session at the given offset
      description: |
        Body is the raw chunk; the absolute byte offset goes in the
        `Upload-Offset` header. The server returns the new total in
        the `Upload-Offset` response header.
      tags: [uploads]
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Accepted; current offset returned in Upload-Offset
          headers:
            Upload-Offset:
              schema: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      operationId: abortUpload
      summary: Discard an in-progress session
      tags: [uploads]
      responses:
        '204': { description: Aborted }
        '500': { $ref: '#/components/responses/Internal' }

  /api/uploads/{id}/finalize:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: finalizeUpload
      summary: Close a session and publish the bytes to BlobStore
      tags: [uploads]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadFinalized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ============================= AUTH =============================
  /api/auth/login:
    post:
      tags: [auth]
      summary: Authenticate by email/username + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session token, or a 2FA challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Account frozen/deleted or login throttled }

  /api/auth/login/2fa:
    post:
      tags: [auth]
      summary: Complete a 2FA login challenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login2FARequest' }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user (roles + permissions)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me/password:
    post:
      tags: [auth]
      summary: Change own password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me/onboarding/{tour}:
    post:
      tags: [auth]
      summary: Mark one first-run tour as finished or skipped
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tour
          in: path
          required: true
          description: Tour id, e.g. `viewer` or `panorama`
          schema: { type: string }
      responses:
        '204': { description: Marked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/2fa/setup:
    post:
      tags: [auth]
      summary: Provision a pending TOTP secret
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: TOTP secret + otpauth URL (render as QR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Setup2FAResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 2FA already enabled }

  /api/auth/2fa/enable:
    post:
      tags: [auth]
      summary: Confirm TOTP and receive recovery codes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Enable2FARequest' }
      responses:
        '200':
          description: One-time recovery codes (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enable2FAResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/2fa/disable:
    post:
      tags: [auth]
      summary: Disable TOTP
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Disable2FARequest' }
      responses:
        '204': { description: 2FA disabled }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/2fa/recovery/regenerate:
    post:
      tags: [auth]
      summary: Regenerate recovery codes (requires a current TOTP code)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Enable2FARequest' }
      responses:
        '200':
          description: A fresh set of one-time recovery codes (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enable2FAResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/passkey/login/begin:
    post:
      tags: [auth]
      summary: Begin usernameless passkey login (discoverable credentials)
      responses:
        '200':
          description: WebAuthn request options + a flow id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyBeginResponse' }

  /api/auth/passkey/login/finish:
    post:
      tags: [auth]
      summary: Finish passkey login; returns a session token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyLoginFinishRequest' }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/passkey/register/begin:
    post:
      tags: [auth]
      summary: Begin passkey enrollment for the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: WebAuthn creation options + a flow id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyBeginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/passkey/register/finish:
    post:
      tags: [auth]
      summary: Finish passkey enrollment; stores the credential
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyRegisterFinishRequest' }
      responses:
        '200':
          description: The stored passkey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/passkey/credentials:
    get:
      tags: [auth]
      summary: List the authenticated user's passkeys
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The user's passkeys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/passkey/credentials/{id}:
    delete:
      tags: [auth]
      summary: Delete one of the authenticated user's passkeys (requires step-up re-auth)
      description: >
        Requires re-authentication: a TOTP code when 2FA is enabled, otherwise
        the account password. The server picks the factor from the 2FA state.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyDeleteRequest' }
      responses:
        '204': { description: Passkey deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/users:
    get:
      tags: [auth]
      summary: List users (requires users:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, frozen, deleted] } }
        - { in: query, name: includeDeleted, schema: { type: boolean } }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuthUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [auth]
      summary: Create a user (requires users:write)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Email or username already exists }

  /api/auth/users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [auth]
      summary: Get a user (requires users:read)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [auth]
      summary: Update a user's roles (requires users:write)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [auth]
      summary: Soft-delete a user (requires users:delete)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Soft-deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Self-target or last-admin guard }

  /api/auth/users/{id}/freeze:
    post:
      tags: [auth]
      summary: Freeze a user, killing their sessions (requires users:freeze)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Frozen user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Self-target or last-admin guard }

  /api/auth/users/{id}/unfreeze:
    post:
      tags: [auth]
      summary: Unfreeze a user (requires users:freeze)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Active user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/users/{id}/restore:
    post:
      tags: [auth]
      summary: Restore a soft-deleted user (requires users:delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Restored user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/users/{id}/owner:
    post:
      tags: [auth]
      summary: Grant or revoke the owner flag (caller must already be an owner)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isOwner]
              properties:
                isOwner: { type: boolean }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not an owner }
        '422': { description: Self-target guard }

  /api/auth/roles:
    get:
      tags: [auth]
      summary: List roles (requires roles:read)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuthRole' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [auth]
      summary: Create a role (requires roles:manage)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Created role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Role slug already exists }

  /api/auth/roles/{slug}:
    parameters:
      - { in: path, name: slug, required: true, schema: { type: string } }
    patch:
      tags: [auth]
      summary: Rename a role (requires roles:manage)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthRole' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [auth]
      summary: Delete a non-system role (requires roles:manage)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: System role cannot be deleted }

  /api/auth/roles/{slug}/permissions:
    put:
      tags: [auth]
      summary: Replace a role's permissions (requires roles:manage)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRolePermissionsRequest' }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/permissions:
    get:
      tags: [auth]
      summary: List the permission catalog (requires permissions:read)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuthPermission' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===================== BINARY / STREAMING =====================
  # Served by custom root-router handlers (asset reverse-proxy + SSE), not the
  # strict /api group — documented here for completeness, excluded from server
  # stub generation via the `assets`/`jobs` tags.
  /api/assets/{hash}:
    get:
      tags: [assets]
      summary: Stream a content-addressed GLB/binary blob
      description: Transparent reverse proxy to asset-service. Range-aware, immutable cache, strong ETag.
      parameters:
        - { in: path, name: hash, required: true, schema: { type: string }, description: SHA-256 content hash }
        - { in: header, name: Range, required: false, schema: { type: string } }
        - { in: header, name: If-None-Match, required: false, schema: { type: string } }
      responses:
        '200':
          description: Binary blob
          content:
            model/gltf-binary:
              schema: { type: string, format: binary }
        '206': { description: Partial content (Range request) }
        '304': { description: Not Modified (If-None-Match matched the ETag) }
        '404': { $ref: '#/components/responses/NotFound' }
    head:
      tags: [assets]
      summary: Blob headers only (Content-Length, ETag) without the body
      parameters:
        - { in: path, name: hash, required: true, schema: { type: string } }
      responses:
        '200': { description: Headers only }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/jobs/{id}/events:
    get:
      tags: [jobs]
      summary: Server-Sent Events stream for one conversion job
      description: >
        Emits `event: job` whenever the job state changes; the stream closes on
        succeeded/failed. The gateway polls mesh-api under the hood. Each event's
        `data:` payload is a Job JSON (kind + slug identify the entity).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/metrics/query:
    get:
      tags: [metrics]
      summary: Owner-only Prometheus panel query
      description: >
        Resolves a dashboard panel ID to server-side PromQL and runs it against
        Prometheus. The PromQL never leaves the server and no caller-supplied
        expression reaches Prometheus — `panel` and `range` are both validated
        against server-side allow-lists, so the endpoint is not an SSRF or query
        injection surface. Requires a valid session AND the owner flag; a
        non-owner with a valid token gets 403. Responses are `Cache-Control:
        no-store`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: panel
          required: true
          description: >
            Panel ID from the server-side registry, mirrored by the client's
            panel-catalog. Instant (single-value) panels return one point per
            series; the rest are range queries of roughly 200 points.
          schema:
            type: string
            enum:
              [stat-up, stat-rps, stat-errors, stat-p99, stat-queue,
               red-rate, red-errors, red-latency, red-http,
               domain-conversions, domain-conversion-p95, domain-queue,
               domain-upload, domain-auth, domain-twofa,
               runtime-memory, runtime-goroutines, runtime-gc, runtime-fds,
               alerts]
        - in: query
          name: range
          required: true
          description: Query window. Step is derived server-side (~200 points, rounded to whole 15s scrapes).
          schema: { type: string, enum: [1h, 6h, 24h, 7d] }
      responses:
        '200':
          description: One entry per time series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricSeries' }
        '400':
          description: Unknown panel ID or unsupported range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Prometheus unreachable or returned an error (details are logged, not returned)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /healthz:
    get:
      tags: [ops]
      summary: Liveness probe
      description: Always 200 while the process is running. Not authenticated; excluded from request logs.
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [ops]
      summary: Readiness probe
      description: >
        503 until the server has finished booting, then runs every registered
        probe concurrently. `status` is `ok` when all pass, `degraded` when any
        fails, `not_ready` before boot completes. Not authenticated; excluded
        from request logs.
      responses:
        '200':
          description: Ready — all probes passed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Not ready yet, or at least one probe failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /openapi.json:
    get:
      tags: [ops]
      summary: This document, as JSON
      description: Served from the spec embedded in the binary at build time, not from disk.
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/json:
              schema: { type: object }

  /docs:
    get:
      tags: [ops]
      summary: Scalar API explorer
      responses:
        '200':
          description: HTML page rendering /openapi.json
          content:
            text/html:
              schema: { type: string }
